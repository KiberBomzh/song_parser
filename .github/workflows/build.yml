name: Build

on:
    workflow_dispatch:
    push:
        branches: [master]

jobs:
    build-linux:
        name: Build for linux
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Initialization submodules
              run: git submodule update --init --recursive

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Setup Python
              uses: astral-sh/setup-uv3cdf50e0924f1ace7a92ddbac98b12a958b87688

            - name: Check uv
              run: uv self version

            - name: Install dependencies
              run: uv sync

            - name: Build
              run: uv run pyinstaller song-parser_linux.spec

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: song-parser_linux
                  path: dist/*
