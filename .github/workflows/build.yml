name: Build

on:
    workflow_dispatch:
    push:
        branches: [master]

jobs:
    build-linux:
        name: Build for linux
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Initialization submodules
              run: git submodule update --init --recursive

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Setup Python
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

            - name: Install dependencies
              run: uv sync

            - name: Build
              run: uv run pyinstaller song-parser_linux.spec

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: song-parser_linux
                  path: dist/*

    build-windows:
        name: Build for Windows
        runs-on: windows-2022
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Initialization submodules
              run: git submodule update --init --recursive

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc
            
            - name: Setup Python
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

            - name: Install dependencies
              run: uv sync

            - name: Build
              run: uv run pyinstaller song-parser_windows.spec

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: song-parser_windows
                  path: dist/*