name: Build

on:
    workflow_dispatch:
    push:
        branches: [master]

jobs:
    build-linux:
        name: Build for linux
        runs-on: ubuntu-22.04
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Setup Python
              uses: astral-sh/setup-uv@v1

            - name: Build
              run: uv run pyinstaller song-parser_linux.spec

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: song-parser_linux
                  path: dist/*
